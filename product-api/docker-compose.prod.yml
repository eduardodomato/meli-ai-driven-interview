version: '3.8'

services:
  product-api:
    image: product-api:latest
    container_name: product-api-prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - product-api-network

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: product-api-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - product-api
    networks:
      - product-api-network

networks:
  product-api-network:
    driver: bridge
